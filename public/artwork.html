<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Adjust object drawings</title><link rel="stylesheet" href="/app.css"><link rel="stylesheet" href="/artwork.css"></head>
<body><main class="artwork-editor"><a id="back" href="/">← Back to film</a><h1>Adjust object drawings</h1><p>Hide an unwanted detail or change a colour. Changes are saved to this film; undo restores the previous drawing.</p><label>Object <select id="object"></select></label><canvas id="preview" width="640" height="480" aria-label="Object drawing preview"></canvas><p id="status" role="status">Loading drawings…</p><div id="layers"></div><button id="undo" type="button">Undo last edit to this object</button><button id="download" type="button">Download SVG</button></main><script type="module" src="/artwork.js"></script></body></html>
