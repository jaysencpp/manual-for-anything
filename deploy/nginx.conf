# Install under /etc/nginx/conf.d/. Replace manual.example.com and the certificate paths.
# The app keeps the page CSP and related headers itself; TLS, HSTS and per-address limits belong here.
limit_req_zone  $binary_remote_addr zone=manual_login:10m rate=6r/m;
limit_req_zone  $binary_remote_addr zone=manual_requests:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=manual_connections:10m;

upstream manual_app {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name manual.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name manual.example.com;

    ssl_certificate     /etc/letsencrypt/live/manual.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/manual.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    # Enable after confirming HTTPS works: browsers remember this for a year.
    # add_header Strict-Transport-Security "max-age=31536000" always;

    server_tokens off;
    # The app allows 25 MB uploads. nginx buffers them first, so a slow client never holds an upload deadline open.
    client_max_body_size 26m;
    client_body_timeout 30s;
    client_header_timeout 15s;
    limit_conn manual_connections 64;
    limit_req_status 429;
    limit_conn_status 429;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;

    # Monitoring checks 127.0.0.1:8080/healthz directly; it has no public use.
    location = /healthz { return 404; }

    location = /api/login {
        limit_req zone=manual_login burst=5 nodelay;
        proxy_pass http://manual_app;
    }

    # Server-sent events: deliver at once. The app sends a heartbeat every 25 seconds.
    location ~ ^/api/films/\w+/events$ {
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_pass http://manual_app;
    }

    location / {
        limit_req zone=manual_requests burst=200 nodelay;
        proxy_pass http://manual_app;
    }
}
